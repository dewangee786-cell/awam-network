<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithRedirect,
      getRedirectResult,
      GoogleAuthProvider,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      onValue,
      set,
      get,
      push
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvbrB6vgOwLLzFLymZ3213b249DAn5jbY",
      authDomain: "awam-network-318ec.firebaseapp.com",
      databaseURL: "https://awam-network-318ec-default-rtdb.firebaseio.com",
      projectId: "awam-network-318ec",
      messagingSenderId: "313453438241",
      appId: "1:313453438241:web:19189b495154fc7326fea0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({
      prompt: "select_account"
    });

    let currentSelectedTrack = "";
    let trackLessonsArray = [];
    let activeLessonIndex = 0;
    let quizTimerInterval = null;
    let proctorExamActive = false;

    // Secure Google Login
    const googleLoginBtn = document.getElementById("btnGoogleLogin");

    if (googleLoginBtn) {
      googleLoginBtn.addEventListener("click", async () => {
        try {
          await signInWithRedirect(auth, googleProvider);
        } catch (error) {
          console.error("Google Login Error:", error);
          alert("Google Login Error: " + error.message);
        }
      });
    }

    // Google Redirect Result
    getRedirectResult(auth).catch((error) => {
      console.error("Google Redirect Error:", error);
    });

    // Authentication State
    onAuthStateChanged(auth, (user) => {

      if (user) {

        document.getElementById("loginScreen")?.classList.add("hidden");
        document.getElementById("app")?.classList.remove("hidden");

        const userName = document.getElementById("userName");
        const userEmail = document.getElementById("userEmail");

        if (userName) {
          userName.innerText = user.displayName || "Verified User";
        }

        if (userEmail) {
          userEmail.innerText = user.email || "";
        }

        // Super Admin
        if (user.email === "dewan.gee786@gmail.com") {

          document.getElementById("superAdminSection")?.classList.remove("hidden");

          if (typeof loadAdminTuitionTickets === "function") {
            loadAdminTuitionTickets();
          }

        } else {

          document.getElementById("superAdminSection")?.classList.add("hidden");

        }

        // Wallet
        onValue(
          ref(database, "wallets/" + user.uid + "/balance"),
          (snapshot) => {

            const walletLabel = document.getElementById("lblWallet");

            if (walletLabel) {
              walletLabel.innerText =
                (snapshot.val() ? snapshot.val() : "0.00") + " PKR";
            }

          }
        );

      } else {

        document.getElementById("loginScreen")?.classList.remove("hidden");
        document.getElementById("app")?.classList.add("hidden");

      }

    });
