<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged } from "https://gstatic.com";
    import { getDatabase, ref, onValue, set, get, push } from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyCvbrB6vgOwLLzFLymZ3213b249DAn5jbY",
      authDomain: "://firebaseapp.com",
      databaseURL: "https://firebaseio.com",
      projectId: "awam-network-318ec",
      storageBucket: "://appspot.com",
      messagingSenderId: "313453438241",
      appId: "1:313453438241:web:19189b495154fc7326fea0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: 'select_account' });

    let currentSelectedTrack = "";
    let trackLessonsArray = [];
    let activeLessonIndex = 0;
    let quizTimerInterval = null;
    let proctorExamActive = false;

    // Secure Redirect Action to fully bypass network blocks on hosting instances
    document.getElementById('btnGoogleLogin').addEventListener('click', async () => {
      try { 
        await signInWithRedirect(auth, googleProvider); 
      } catch (error) { 
        alert("Authentication setup error: " + error.message); 
      }
    });

    // Capture dynamic login state token natively upon redirect landing landing
    getRedirectResult(auth).catch((error) => {
      console.error("Redirect connection failure handler:", error);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('userName').innerText = user.displayName;
        document.getElementById('userEmail').innerText = user.email;

        if (user.email === 'dewan.gee786@gmail.com') {
          document.getElementById('superAdminSection').classList.remove('hidden');
          loadAdminTuitionTickets();
        } else {
          document.getElementById('superAdminSection').classList.add('hidden');
        }

        onValue(ref(database, 'wallets/' + user.uid + '/balance'), (snapshot) => {
          document.getElementById('lblWallet').innerText = (snapshot.val() ? snapshot.val() : "0.00") + " PKR";
        });
      } else {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('app').classList.add('hidden');
      }
    });

    // 🔒 Wallet Balance Manager
    window.triggerServerTransaction = async function(type) {
      const targetUid = document.getElementById('txtAdminTargetUid').value;
      const amount = document.getElementById('txtAdminAmount').value;
      if(!targetUid || !amount) { alert('Please fill all fields'); return; }
      const walletRef = ref(database, 'wallets/' + targetUid);
      try {
        const snapshot = await get(walletRef);
        let currentData = snapshot.val() ? snapshot.val() : { balance: 0 };
        let currentBalance = parseFloat(currentData.balance || 0);
        if (type === 'credit') currentBalance += parseFloat(amount);
        else if (type === 'debit') { currentBalance -= parseFloat(amount); if (currentBalance < 0) currentBalance = 0; }
        await set(walletRef, { balance: currentBalance, currency: "PKR" });
        alert(`Success! Updated balance.`);
      } catch (err) { alert(err.message); }
    };

    // 🎓 Admin: Publish Curriculum
    window.publishAutomatedLesson = async function() {
      const track = document.getElementById('selAdminTrack').value;
      const title = document.getElementById('txtLessonTitle').value;
      const theory = document.getElementById('txtLessonTheory').value;
      const practical = document.getElementById('txtLessonPractical').value;
      
      const q = document.getElementById('txtQuizQ').value;
      const a = document.getElementById('txtQuizA').value;
      const b = document.getElementById('txtQuizB').value;
      const c = document.getElementById('txtQuizC').value;
      const d = document.getElementById('txtQuizD').value;
      const correct = document.getElementById('txtQuizCorrect').value.toUpperCase().trim();

      if(!title || !theory || !practical || !q || !a || !b || !c || !d || !correct) { alert("Fill all elements."); return; }

      try {
        const lessonRef = push(ref(database, `curriculum/${track}`));
        await set(lessonRef, {
          title, theory, practical,
          quiz: { question: q, options: { A: a, B: b, C: c, D: d }, answer: correct }
        });
        alert("Lesson with associated test published successfully!");
      } catch (e) { alert(e.message); }
    };

    // 🎓 Student Track Dynamic Initiation
    window.startSpecializedTrack = function(trackId) {
      currentSelectedTrack = trackId;
      document.getElementById('courseSelectionScreen').classList.add('hidden');
      document.getElementById('lessonActiveScreen').classList.remove('hidden');
      
      const names = { basic_it: "Basic IT", fullstack_web: "Fullstack Web", cloud_cyber: "Cloud & Cyber", ai_data: "AI Engineering" };
      document.getElementById('lblActiveTrackTitle').innerText = `Track: ${names[trackId]} Program`;

      onValue(ref(database, `curriculum/${trackId}`), (snapshot) => {
        const data = snapshot.val();
        trackLessonsArray = [];
        if(data) {
          Object.keys(data).forEach(k => { trackLessonsArray.push({ id: k, ...data[k] }); });
          activeLessonIndex = trackLessonsArray.length - 1; 
          renderActiveLessonStructure();
        } else {
          document.getElementById('lessonContentContainer').innerHTML = "<p>Curriculum index is being generated by automation bot.</p>";
        }
      });
    };

    window.exitLearningTrack = function() {
      clearInterval(quizTimerInterval);
      proctorExamActive = false;
      document.getElementById('courseSelectionScreen').classList.remove('hidden');
      document.getElementById('lessonActiveScreen').classList.add('hidden');
    };

    function renderActiveLessonStructure() {
      clearInterval(quizTimerInterval);
      proctorExamActive = false;
      document.getElementById('assessmentSection').classList.add('hidden');

      if(trackLessonsArray.length === 0 || !trackLessonsArray[activeLessonIndex]) return;
      const currentLesson = trackLessonsArray[activeLessonIndex];

      document.getElementById('lblLessonTopic').innerText = `Day ${activeLessonIndex + 1}: ${currentLesson.title}`;
      document.getElementById('lblLessonTheory').innerText = currentLesson.theory;
      document.getElementById('lblLessonPractical').innerText = currentLesson.practical;

      document.getElementById('btnPrevLesson').disabled = (activeLessonIndex === 0);
    }

    window.navigateLesson = function(direction) {
      if(direction === 1) {
        triggerNextDayVerificationTest();
      } else {
        if(activeLessonIndex > 0) { activeLessonIndex--; renderActiveLessonStructure(); }
      }
    };

    function triggerNextDayVerificationTest() {
      const currentLesson = trackLessonsArray[activeLessonIndex];
      if(!currentLesson || !currentLesson.quiz) return;

      document.getElementById('assessmentSection').classList.remove('hidden');
      const qBody = document.getElementById('quizQuestionBody');
      qBody.classList.remove('disabled-click');
      
      qBody.innerHTML = `
        <p style="font-weight:bold; margin-bottom:10px;">📝 ${currentLesson.quiz.question}</p>
        <label class="quiz-option"><input type="radio" name="trackQ" value="A"> A) ${currentLesson.quiz.options.A}</label>
        <label class="quiz-option"><input type="radio" name="trackQ" value="B"> B) ${currentLesson.quiz.options.B}</label>
        <label class="quiz-option"><input type="radio" name="trackQ" value="C"> C) ${currentLesson.quiz.options.C}</label>
        <label class="quiz-option"><input type="radio" name="trackQ" value="D"> D) ${currentLesson.quiz.options.D}</label>
        <br>
        <button class="btn-action" style="background:var(--danger); width:100%;" onclick="submitTrackVerificationTest()">Evaluate & Unlock Next Day</button>
      `;

      proctorExamActive = true;
      let timeLimit = 45;
      document.getElementById('secondsLeft').innerText = timeLimit;
      
      quizTimerInterval = setInterval(() => {
        timeLimit--;
        document.getElementById('secondsLeft').innerText = timeLimit;
        if(timeLimit <= 0) {
          clearInterval(quizTimerInterval);
          alert("Time Expired! Moving lock status.");
          window.submitTrackVerificationTest(true);
        }
      }, 1000);
    }

    window.submitTrackVerificationTest = async function(forcedFail = false) {
      clearInterval(quizTimerInterval);
      if(!proctorExamActive && !forcedFail) return;
      proctorExamActive = false;

      const currentLesson = trackLessonsArray[activeLessonIndex];
      let selected = document.querySelector('input[name="trackQ"]:checked');
      let userPassed = false;

      if(!forcedFail && selected && selected.value === currentLesson.quiz.answer) {
        userPassed = true;
      }

      const user = auth.currentUser;
      try {
        await set(ref(database, `exams/submissions/${user.uid}/${currentLesson.id}`), {
          track: currentSelectedTrack,
          lessonTitle: currentLesson.title,
          status: userPassed ? "Passed" : "Failed (Incorrect/Timeout)",
          timestamp: new Date().toISOString()
        });

        if(userPassed) {
          alert("🎉 Correct Answer! Next day task unlocked successfully.");
